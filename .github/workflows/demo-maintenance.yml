name: Demo maintenance

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: keepalive หรือ reset
        required: true
        default: keepalive
        type: choice
        options: [keepalive, reset]

env:
  API_URL: https://wingdai-api.vercel.app/api

jobs:
  # Supabase ระดับฟรีพักฐานเมื่อไม่มีใครใช้ครบ 7 วัน แล้วลิงก์สาธิตจะเหลือแค่ข้อมูลจำลอง
  keepalive:
    if: github.event.schedule == '0 */6 * * *' || github.event.inputs.task == 'keepalive'
    runs-on: ubuntu-latest
    steps:
      - name: ping API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$API_URL/health")
          echo "health -> $code"
          test "$code" = "200"
      - name: ping ฐานข้อมูลผ่านเส้นทางที่ query จริง
        run: |
          count=$(curl -s --max-time 30 "$API_URL/catalog/restaurants" | grep -o '"id"' | wc -l)
          echo "restaurants -> $count"
          test "$count" -gt 0

  # ใครก็ล็อกอินเป็น super_root แล้วแก้ค่าคอมหรือลบของได้ ตี 2 ตามเวลาไทยจึงล้างกลับเป็นชุดตั้งต้น
  #
  # secret DATABASE_URL ต้องเป็นสาย session pooler (pooler.supabase.com พอร์ต 5432)
  # ไม่ใช่สายตรง db.<ref>.supabase.co เพราะโฮสต์นั้นมีแต่ระเบียน AAAA ส่วน runner ของ GitHub
  # ต่อ IPv6 ไม่ได้ ใช้สายตรงแล้วจะล้มตั้งแต่ก่อนแตะฐาน · พอร์ต 6543 เป็น transaction mode รัน migration ไม่ได้
  reset:
    if: github.event.schedule == '0 19 * * *' || github.event.inputs.task == 'reset'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/core-api/package-lock.json
      - run: npm ci
      # ล้มตรงนี้อ่านออกว่าต้องแก้อะไร ต่างจากปล่อยให้ไปตายที่ ENETUNREACH ตอน connect
      - name: ตรวจสาย DATABASE_URL ก่อนแตะฐาน
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ยังไม่ได้ตั้ง secret DATABASE_URL"; exit 1
          fi
          case "$DATABASE_URL" in
            *YOUR-PASSWORD*|*'[YOUR'*)
              echo "สายนี้ยังเป็นตัวอย่างจากหน้า Supabase ยังไม่ได้แทนรหัสผ่านจริง"; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *pooler.supabase.com:5432*) echo "ok — session pooler" ;;
            *pooler.supabase.com:6543*)
              echo "ตอนนี้ชี้ไปพอร์ต 6543 (transaction mode) รัน migration ไม่ได้ ให้เปลี่ยนเป็น 5432"; exit 1 ;;
            *)
              echo "ตอนนี้ชี้ไปสายตรง db.<ref>.supabase.co ซึ่งมีแต่ระเบียน AAAA"
              echo "runner ของ GitHub ต่อ IPv6 ไม่ได้ ให้ใช้สาย session pooler (pooler.supabase.com พอร์ต 5432)"
              exit 1 ;;
          esac
      - run: npm run db:reset -- --yes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:setup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:demo-orders
        env:
          DEMO_API_URL: ${{ env.API_URL }}
